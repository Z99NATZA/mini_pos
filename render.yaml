# render.yaml — Render infrastructure-as-code
# Docs: https://render.com/docs/yaml-spec
#
# Database: Supabase PostgreSQL (Session Pooler — IPv4 compatible)

services:
  - type: web
    name: mini-pos-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free

    envVars:
      - key: APP_ENV
        value: production

      - key: APP_DEBUG
        value: "false"

      # Set after first deploy — e.g. https://mini-pos-backend.onrender.com
      - key: APP_URL
        sync: false

      - key: JWT_SECRET
        generateValue: true

      - key: UPLOAD_PATH
        value: uploads

      - key: MAX_UPLOAD_SIZE
        value: "12288"

      - key: SUPABASE_URL
        value: https://fytwcqxgmejgwvzshdyb.supabase.co

      - key: SUPABASE_SERVICE_KEY
        sync: false

      # --- Supabase Session Pooler (IPv4 compatible) ---
      - key: DB_HOST
        value: aws-1-ap-northeast-1.pooler.supabase.com

      - key: DB_PORT
        value: "5432"

      - key: DB_NAME
        value: postgres

      - key: DB_USER
        value: postgres.fytwcqxgmejgwvzshdyb

      # Set this manually in the Render dashboard (your Supabase DB password)
      - key: DB_PASSWORD
        sync: false
